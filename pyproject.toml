[project]
name = "meeting-prep"
version = "0.1.0"
requires-python = ">=3.12"
description = "CLI agent that turns an upcoming meeting into a one-page prep brief."
dependencies = [
    "mcp[cli]>=1.20,<2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
