[project]
name = "meeting-prep"
version = "0.1.0"
requires-python = ">=3.12"
description = "CLI agent that turns an upcoming meeting into a one-page prep brief."
dependencies = [
    "fastapi>=0.115",
    "google-genai>=1.30",
    "httpx>=0.27",
    "markdown-it-py>=3",
    "mcp[cli]>=1.20,<2",
    "pypdf>=5",
    "python-docx>=1.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
